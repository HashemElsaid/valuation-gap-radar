[client]
toolbarMode = "viewer"  # hide the developer menu from people viewing the demo

[browser]
gatherUsageStats = false
# ---------------------------------------------------------------------------
# Look and feel, following joinsooner.com: Manrope type, near-black ink,
# white and warm-grey surfaces, and Sooner's lime (#e9fe0f) as a highlighter.
#
# - The accent (primaryColor) is near-black in light mode, like Sooner's black
#   buttons; lime text on white would be unreadable. In dark mode lime reads
#   well on black, so it becomes the accent there.
# - The lime highlighter itself is drawn in app.py (black text on lime, as on
#   Sooner's site), so it reads the same in light and dark mode.
# - Risk levels use red (High), orange (Medium) and green (Low), always with an
#   icon and a label. Medium is orange so it never looks like the brand lime.
# ---------------------------------------------------------------------------
[theme]
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 650
baseRadius = "medium"
buttonRadius = "medium"
showSidebarBorder = true

[theme.light]
primaryColor = "#0e0d0d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f4f0"
textColor = "#0e0d0d"
linkColor = "#0e0d0d"
borderColor = "#e6e4dd"
redColor = "#d03b3b"
redTextColor = "#a82828"
orangeColor = "#e8890c"
orangeTextColor = "#8a4b00"
greenColor = "#0ca30c"
greenTextColor = "#0a6e0a"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100"]

[theme.light.sidebar]
backgroundColor = "#f5f4f0"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#e9fe0f"
backgroundColor = "#0e0d0d"
secondaryBackgroundColor = "#1d1b1b"
textColor = "#f4f4f4"
linkColor = "#e9fe0f"
borderColor = "#2f2b2d"
redColor = "#e66767"
redTextColor = "#ff8a8a"
orangeColor = "#f0a040"
orangeTextColor = "#ffc27a"
greenColor = "#0ca30c"
greenTextColor = "#5ce488"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500"]

[theme.dark.sidebar]
backgroundColor = "#161414"
secondaryBackgroundColor = "#232020"
